# Qdrant, the vector database for the bootcamp.
#
#   docker compose up -d      start it
#   docker compose ps         check it is running
#   docker compose down       stop it, keeping the data
#
# The dashboard is at http://localhost:6333/dashboard once it is up.
#
# If you already have a Qdrant container on port 6333 from another project,
# keep using that one and skip this file. Collections keep the data separate.

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: finance-rag-qdrant
    ports:
      - "6333:6333"     # REST API, the one the bootcamp uses
      - "6334:6334"     # gRPC, not used here
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
